name: Manual Database Schema Sync & Check

on:
  workflow_dispatch:

concurrency:
  group: db-migrate-manual
  cancel-in-progress: false

jobs:
  db-sync:
    name: Check & Sync DB Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check & Apply Prisma DB Schema
        run: |
          curl -sSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy boardgametime-app:us-central1:boardgametime-db --address 127.0.0.1 --port 5432 > proxy.log 2>&1 &
          PROXY_PID=$!
          sleep 5
          pnpm --filter @boardgametime/db exec prisma db push || (echo "=== CLOUD SQL PROXY LOG ===" && cat proxy.log && kill $PROXY_PID 2>/dev/null && exit 1)
          kill $PROXY_PID 2>/dev/null || true
