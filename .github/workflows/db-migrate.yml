name: Manual Database Schema Sync & Check

on:
  workflow_dispatch:

concurrency:
  group: db-migrate-manual
  cancel-in-progress: false

jobs:
  db-sync:
    name: Check & Sync DB Schema
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check & Apply Prisma DB Schema
        run: pnpm --filter @boardgametime/db exec prisma db push
