name: Manual Database Schema Sync & Check

on:
  workflow_dispatch:

concurrency:
  group: db-migrate-manual
  cancel-in-progress: false

jobs:
  db-sync:
    name: Check & Sync DB Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        uses: GoogleCloudPlatform/cloud-sql-proxy-action@v1
        with:
          instance-connection-name: 'boardgametime-app:us-central1:boardgametime-db'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check & Apply Prisma DB Schema
        run: pnpm --filter @boardgametime/db exec prisma db push
