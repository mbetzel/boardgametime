name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Run unit tests and linting
  # ──────────────────────────────────────────────
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/boardgametime_test?schema=public"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  # ──────────────────────────────────────────────
  # Build Docker images and push to Artifact Registry
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    env:
      REGISTRY: us-central1-docker.pkg.dev
      API_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/boardgametime-repo/api
      WEB_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/boardgametime-repo/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set short SHA tag
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build API image
        run: |
          docker build \
            -t ${{ env.API_IMAGE }}:${{ steps.tags.outputs.sha_tag }} \
            -t ${{ env.API_IMAGE }}:latest \
            -f apps/api/Dockerfile .

      - name: Build Web image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t ${{ env.WEB_IMAGE }}:${{ steps.tags.outputs.sha_tag }} \
            -t ${{ env.WEB_IMAGE }}:latest \
            -f apps/web/Dockerfile .

      - name: Push API image
        run: |
          docker push ${{ env.API_IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          docker push ${{ env.API_IMAGE }}:latest

      - name: Push Web image
        run: |
          docker push ${{ env.WEB_IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          docker push ${{ env.WEB_IMAGE }}:latest

    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}

  # ──────────────────────────────────────────────
  # Migrate Production Database Schema (Conditional)
  # ──────────────────────────────────────────────
  db-migrate:
    name: Run DB Migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for DB schema changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            db:
              - 'packages/db/prisma/**'

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install pnpm
        if: steps.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: steps.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Apply DB Schema Migrations
        if: steps.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy boardgametime-app:us-central1:boardgametime-db --port 5432 > proxy.log 2>&1 &
          PROXY_PID=$!
          sleep 4
          cat proxy.log
          pnpm --filter @boardgametime/db exec prisma db push
          kill $PROXY_PID 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Deploy API to Cloud Run
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    needs: [build-and-push, db-migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: boardgametime-api
          region: ${{ secrets.GCP_REGION }}
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/boardgametime-repo/api:${{ needs.build-and-push.outputs.sha_tag }}

      - name: Verify API deployment
        run: |
          echo "✅ API deployed with image tag: ${{ needs.build-and-push.outputs.sha_tag }}"

  # ──────────────────────────────────────────────
  # Deploy Web to Cloud Run
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Web
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: boardgametime-web
          region: ${{ secrets.GCP_REGION }}
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/boardgametime-repo/web:${{ needs.build-and-push.outputs.sha_tag }}

      - name: Invalidate Cloud CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache boardgametime-web-cdn-urlmap --project="${{ secrets.GCP_PROJECT_ID }}" --path "/*" --async

      - name: Verify Web deployment
        run: |
          echo "✅ Web deployed with image tag: ${{ needs.build-and-push.outputs.sha_tag }}"
